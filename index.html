<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f3f5" />
  <meta name="description" content="Consolas y ordenadores de todas las épocas. Emulación local en el navegador. Un proyecto de Alejandro Pico." />
  <style>:root{background:#f2f3f5}:root[data-theme=night]{background:#151a23}:root[data-theme=afternoon]{background:#eadfd0}</style>
  <script>try{let t=localStorage.getItem('videogames:v1:theme')||'day';if(t==='auto'){const h=new Date().getHours();t=h<7||h>=21?'night':h>=18?'afternoon':'day'}document.documentElement.dataset.theme=t}catch{}</script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=0.1.0" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <title>VideoGames</title>
</head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
